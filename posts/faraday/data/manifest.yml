version: 1
scope: "Tracked artifacts under assets/blog/data"
note: >
  This manifest describes the shipped blog data and metadata artifacts. It does
  not grant redistribution rights. Third-party-derived scientific data remains
  subject to provider terms documented in DATA_NOTICE.md.

redistribution_statuses:
  project_metadata: "Project-authored metadata/instructions; Apache-2.0 applies unless noted otherwise."
  codata_attribution: "NIST CODATA-derived constants/factual calculations; attribute NIST CODATA 2022."
  nist_srd_restricted: "Derived from NIST Standard Reference Data; illustrative only, not cleared for broad redistribution."
  pubchem_policy: "Derived from PubChem/NCBI molecular data; NCBI places no restrictions on molecular data but cannot grant third-party rights."
  hitran_aggregate: "Aggregate derived from HITRAN; cite HITRAN2024, do not redistribute raw line lists."

artifacts:
